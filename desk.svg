    <text x="509" y="73" text-anchor="middle" class="sans msg" font-size="15" font-weight="600" fill="#111111" style="animation-delay:0.0s">Hey! I&#x27;m Aman.</text><text x="509" y="73" text-anchor="middle" class="sans msg" font-size="15" font-weight="600" fill="#111111" style="animation-delay:3.2s">Ex-Google, ex-AlgoUniversity.</text><text x="509" y="73" text-anchor="middle" class="sans msg" font-size="15" font-weight="600" fill="#111111" style="animation-delay:6.4s">LeetCode 1998, top 8%.</text><text x="509" y="73" text-anchor="middle" class="sans msg" font-size="15" font-weight="600" fill="#111111" style="animation-delay:9.6s">CS at MIT Bengaluru.</text><text x="509" y="73" text-anchor="middle" class="sans msg" font-size="15" font-weight="600" fill="#111111" style="animation-delay:12.8s">Day 12 of my streak.</text><text x="509" y="73" text-anchor="middle" class="sans msg" font-size="15" font-weight="600" fill="#111111" style="animation-delay:16.0s">Building agents that ask first.</text>
