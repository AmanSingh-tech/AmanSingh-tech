<svg xmlns="http://www.w3.org/2000/svg" width="850" height="340" viewBox="0 0 850 340" role="img" aria-label="An illustration of Aman at a desk, typing, with a speech bubble that says hello.">
<defs>
  <radialGradient id="lampglow"><stop offset="0" stop-color="#fff4dc" stop-opacity="0.35"/><stop offset="1" stop-color="#fff4dc" stop-opacity="0"/></radialGradient>
  <radialGradient id="screenglow"><stop offset="0" stop-color="#9fb4ff" stop-opacity="0"/><stop offset="1" stop-color="#9fb4ff" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect width="850" height="340" rx="12"/></clipPath>
</defs>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0.06em; }
  .msg { opacity: 0; animation: msg 19.2s cubic-bezier(0.23, 1, 0.32, 1) infinite both; }
  .type { animation: type 5s steps(8, end) infinite both; }
  .hand-l { animation: tap 2.4s ease-in-out infinite; }
  .hand-r { animation: tap 2.4s ease-in-out 0.12s infinite; }
  .head { transform-origin: 365px 236px; animation: glance 9s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
  .steam { animation: steam 3s ease-out infinite; }
  .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes msg {
    0% { opacity: 0; transform: translateY(4px); filter: blur(2px); }
    2.00% { opacity: 1; transform: none; filter: blur(0); }
    14.67% { opacity: 1; transform: none; filter: blur(0); }
    16.67%, 100% { opacity: 0; transform: translateY(-4px); filter: blur(2px); }
  }
  @keyframes type { 0% { clip-path: inset(0 100% 0 0); } 18%, 92% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
  @keyframes tap {
    0%, 6%, 12%, 18%, 24%, 30%, 36%, 100% { transform: none; }
    3%, 9%, 15%, 21%, 27%, 33% { transform: translateY(-2px); }
  }
  @keyframes glance { 0%, 62% { transform: none; } 70%, 84% { transform: rotate(-5deg) translateX(-2px); } 92%, 100% { transform: none; } }
  @keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 30% { opacity: 0.7; } 100% { opacity: 0; transform: translateY(-10px); } }
  @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .type, .hand-l, .hand-r, .head, .steam, .twinkle { animation: none; }
    .msg { animation-name: msgfade; }
    @keyframes msgfade { 0%, 16.67%, 100% { opacity: 0; } 2.00%, 14.67% { opacity: 1; } }
  }
</style>
