name: Update Space Shooter Game

on:
  schedule:
    - cron: "0 0 * * *"   
  workflow_dispatch:     

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate GitHub Space Shooter GIF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh-space-shooter AmanSingh-tech \
            --output game.gif \
            --max-frames 200 \
            --fps 35

      - name: Commit and push updated GIF
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add game.gif
          git commit -m "Update GitHub space shooter 🎮" || echo "No changes to commit"
          git push

